site_name: ExpEYES-17/SEELab3 Programmer's Manual

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: images/eyes17-logo.png
  favicon: 'images/eyes17-logo.png'
  features:
    - navigation.footer
    - content.code.copy
  icon:
    annotation: material/arrow-right-circle 


#theme: 'readthedocs'

markdown_extensions:
    - toc:
        permalink: True
    - admonition
    - attr_list
    - def_list
    - md_in_html
    - smarty
    - attr_list
    - wikilinks
    - codehilite:
        linenums: False
    - pymdownx.arithmatex:
        generic: true
    - pymdownx.betterem:
        smart_enable: all
    - pymdownx.caret
    - pymdownx.critic
    - pymdownx.details
    - pymdownx.inlinehilite
    - pymdownx.magiclink
    - pymdownx.mark
    - pymdownx.smartsymbols
    - pymdownx.superfences:
       preserve_tabs: true
    - pymdownx.tabbed:
       alternate_style: true
    - pymdownx.tasklist:
        custom_checkbox: True
    - pymdownx.tilde
    - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg


extra_css:
  - assets/main.css
  - https://unpkg.com/katex@0/dist/katex.min.css
extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js
site_favicon: 'images/eyes17-logo.png'

plugins:
   - search
   - exclude-search:
      exclude:
        - programming/intro.md#functions
   - table-reader
   - material/social:
      cards: true
      cards_layout_options:
        background_color: blue # Change background color
        background_image: images/cover.webp
   #- page-to-pdf

extra:
  palette:
      primary: '#087da1'
      accent: '#00a889'


repo_name: 'expeyes-programs'
repo_url: 'https://github.com/expeyes/expeyes-programs'
copyright: 'Jithin B P'

google_analytics:
  - 'UA-67472997-4'
  - 'auto'

site_url: https://eyes17lib.readthedocs.io

extra:
  generator: false
  social:
    - icon: fontawesome/brands/twitter 
      link: https://x.com/csparkresearch
    - icon: fontawesome/brands/instagram
      link: https://instagram.com/csparkresearch
    - icon: fontawesome/brands/github
      link: https://github.com/csparkresearch

nav:
  - Home: 'index.md'
  - Installation: 'installation.md'
  - Python - Functions:
      - 'Introduction': 'programming/intro.md'
      - 'Voltage Measurements': 'programming/analog.md'
      - 'Voltage Outputs': 'programming/analogout.md'
      - 'Waveform Generators': 'programming/waveforms.md'
      - 'Capacitance/Resistance': 'programming/meters.md'
      - 'Digital I/O, Timing': 'programming/digital.md'
      - 'I2C and Sensors': 'programming/sensors.md'
      - Sensors:
          - 'MPU6050 Accel/Gyro': 'programming/sensors/mpu6050.md'
          - 'BMP280 Pressure': 'programming/sensors/bmp280.md'
          - 'TSL2561 Light': 'programming/sensors/tsl2561.md'
          - 'HMC5883L Magnetometer': 'programming/sensors/hmc5883l.md'
          - 'MLX90614 PIR Temp': 'programming/sensors/mlx90614.md'
          - 'ADS1115 ADC': 'programming/sensors/ads1115.md'
          - 'MAX30100 Pulse Ox': 'programming/sensors/max30100.md'
          - 'BH1750 Lux': 'programming/sensors/bh1750.md'
          - 'VL53L0X Distance': 'programming/sensors/vl53l0x.md'
      - 'SPI Bus': 'programming/spi.md'
  - Projects:
      - 'Thermal Physics: Thermoelectric Coeff': 'projects/thermoelectric.md'
      - 'Biomedical: Pulse Sensor': 'projects/pulsesensor.md'
      - 'Biomedical: Glucometer Study': 'projects/glucometer.md'
      - 'Optics: Malus Law': 'projects/malus.md'
  - APT Workshop Schedule: 'workshop.md'

